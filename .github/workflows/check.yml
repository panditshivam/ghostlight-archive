name: Check Ghostlight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:model
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ghostlight-static
          path: dist/
          retention-days: 7

  revival:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revival-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: revival-service/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
